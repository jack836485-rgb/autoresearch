interface:
  display_name: "Idea Improvement Loop"
  short_description: "Develop new ideas from an idea, paper, or problem card"
  default_prompt: "Use $idea-improvement-loop to develop a research idea from my raw idea, baseline paper, or problem card. Learn the shared improver/reviewer standard before proposing candidates. Independent final review needs the three scores, sorted ascending, to meet thresholds 6/7/8, and feasibility pass; self-scores only rank candidates. Separate current effectiveness evidence from future test design. Verify strong baselines through code or sufficient primary specifications, and independently review the eligible pool leader."
