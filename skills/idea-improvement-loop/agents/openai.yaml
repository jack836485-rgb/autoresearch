interface:
  display_name: "Idea Improvement Loop"
  short_description: "Develop new ideas from an idea, paper, or problem card"
  default_prompt: "Use $idea-improvement-loop to develop a genuinely new research idea from my raw idea, supplied baseline paper, or path-stage problem card, summarize a supplied paper or reuse the card evidence before ideation, use highest-neighbor and field-wide drawbacks, reject paper-patching candidates, maintain and rank IDEA_CANDIDATES.md, verify reproducible same-task baselines for the pool leader, and review only the pool leader with a fresh zero-context reviewer."
