interface:
  display_name: "Idea Improvement Loop"
  short_description: "Develop new ideas from an idea or paper"
  default_prompt: "Use $idea-improvement-loop to develop a research idea from my raw idea or baseline paper. Learn the shared improver/reviewer standard before proposing candidates. Independent final review needs two dimensions at least 8, all three at least 6, and feasibility pass; self-scores only rank candidates. Separate current effectiveness evidence from future test design. Verify strong baselines through code or sufficient primary specifications, and independently review the eligible pool leader."
